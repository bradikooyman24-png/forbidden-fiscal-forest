<script>/* Procedural scenery and hand-drawn spirit creatures, rendered locally in Canvas. */
'use strict';
window.ForestArt=(()=>{
 const canvas=document.querySelector('#world'),c=canvas.getContext('2d');
 if(!c)return {setScene(){},setMotion(){}};
 let W=innerWidth,H=innerHeight,ratio=1,scene='start',animal=null,still=false,last=0,start=0,clock=0;
 const PI=Math.PI,TAU=PI*2;
 function rng(seed){return ()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};}const r=rng(7143);
 const stars=Array.from({length:85},()=>({x:r(),y:r()*.62,s:r()*1.4+.35,p:r()*TAU}));
 const trees=Array.from({length:78},(_,i)=>({x:r(),z:.06+r()*.94,h:.72+r()*.5,b:r()*TAU,seed:i*973+24}));
 const motes=Array.from({length:45},()=>({x:r(),y:r(),s:r()*1.5+.4,p:r()*TAU,speed:.3+r()*.8}));
 function ell(x,y,rx,ry,fill,rotation=0){c.beginPath();c.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rotation,0,TAU);c.fillStyle=fill;c.fill();}
 function line(points,color,width=1){c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.strokeStyle=color;c.lineWidth=width;c.stroke();}
 function glow(x,y,radius,color,opacity=1){c.save();c.globalAlpha=opacity;const g=c.createRadialGradient(x,y,0,x,y,Math.max(1,radius));g.addColorStop(0,color);g.addColorStop(1,'rgba(120,215,224,0)');c.fillStyle=g;c.fillRect(x-radius,y-radius,radius*2,radius*2);c.restore();}
 function star(x,y,size,alpha){c.save();c.globalAlpha=alpha;c.fillStyle='#ddf9f1';c.fillRect(x-size/2,y-size/2,size,size);c.restore();}
 function tree(x,ground,height,width,seed,color){const q=rng(seed);c.save();c.fillStyle=color;c.strokeStyle=color;c.lineCap='round';c.lineJoin='round';const bend=(q()-.5)*height*.16;
  c.beginPath();c.moveTo(x-width*.75,ground);c.bezierCurveTo(x-width*.24,ground-height*.38,x+bend-width*.26,ground-height*.72,x+bend,ground-height);c.bezierCurveTo(x+bend+width*.36,ground-height*.67,x+width*.22,ground-height*.3,x+width*.76,ground);c.closePath();c.fill();
  for(let j=0;j<6;j++){const by=ground-height*(.33+j*.10),side=j%2?1:-1,span=height*(.15+q()*.13),trunkX=x+bend*((ground-by)/height);c.lineWidth=width*(.32-j*.033);c.beginPath();c.moveTo(trunkX,by+height*.07);c.quadraticCurveTo(trunkX+side*span*.43,by-height*.04,trunkX+side*span,by-height*(.10+q()*.08));c.stroke();c.lineWidth=Math.max(.7,c.lineWidth*.47);c.beginPath();c.moveTo(trunkX+side*span*.60,by-height*.045);c.lineTo(trunkX+side*span*.68,by-height*.20);c.lineTo(trunkX+side*span*.83,by-height*.25);c.stroke();}
  c.lineWidth=width*.22;for(let j=0;j<3;j++){const side=j%2?1:-1;c.beginPath();c.moveTo(x,ground-height*.04);c.quadraticCurveTo(x+side*width*(1.3+j),ground+width*.5,x+side*width*(2.7+j),ground+width*.65);c.stroke();}c.restore();
 }
 function sky(t,lake=false){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,lake?'#081823':'#07141e');g.addColorStop(.44,lake?'#173949':'#173036');g.addColorStop(.73,'#0b2028');g.addColorStop(1,'#030e15');c.fillStyle=g;c.fillRect(0,0,W,H);const mx=W*(W<550?.73:.76),my=H*.19;glow(mx,my,Math.min(W,H)*.37,'rgba(112,186,197,.12)');
  for(const s of stars){star(s.x*W,s.y*H,s.s,.18+.30*(.5+.5*Math.sin(t*.4+s.p)));}
  glow(mx,my,76,'rgba(175,215,209,.10)');ell(mx,my,18,18,'#c2d2bd');ell(mx-6,my-4,18,18,'#19313a');
 }
 function forest(t,running=false){sky(t);const horizon=H*.44,vx=W*(W<550?.57:.66);
  glow(vx,horizon,Math.min(W*.32,H*.40),'rgba(94,153,156,.19)');
  // A pale winding trail under the canopy.
  c.beginPath();c.moveTo(vx-7,horizon);c.bezierCurveTo(vx-35,H*.61,W*.67,H*.76,W*.40,H);c.lineTo(W*.90,H);c.bezierCurveTo(W*.63,H*.75,vx+60,H*.58,vx+8,horizon);c.closePath();const pathG=c.createLinearGradient(0,horizon,0,H);pathG.addColorStop(0,'#698a8230');pathG.addColorStop(1,'#677c651a');c.fillStyle=pathG;c.fill();
  const sorted=trees.map(tr=>{let z=tr.z;if(running)z=.035+((z+t*.20)%1)*.965;return{...tr,depth:z};}).sort((a,b)=>a.depth-b.depth);
  for(const tr of sorted){const d=tr.depth;const side=tr.x<.5?-1:1;const distance=.13+Math.abs(tr.x-.5)*1.8;let x=vx+side*distance*W*d*.86;const ground=horizon+Math.pow(d,1.3)*H*.62;const ht=H*(.27+.82*d)*tr.h;const width=(4+d*35)*(.7+tr.x*.6);const color=d<.28?'#23454b':d<.52?'#18363d':d<.76?'#0c252c':'#06191f';tree(x,ground,ht,width,tr.seed,color);}
  // Thin rays, not hard-edged spotlights.
  c.save();c.globalCompositeOperation='screen';for(let i=0;i<4;i++){const x=W*(.66+i*.08);c.beginPath();c.moveTo(x,H*.03);c.lineTo(x-W*.13,H*.80);c.lineTo(x-W*.10,H*.80);c.lineTo(x+W*.007,H*.03);c.closePath();c.fillStyle='rgba(125,174,166,.024)';c.fill();}c.restore();
  mist(t);fireflies(t,running);
  if(scene==='fork'||scene==='fork_outcome'){
   const x=W*(W<550?.75:.79),y=H*.59;glow(x,y,55,'rgba(247,213,133,.23)');ell(x,y,4,8,'#e4c887');line([[x-8,y-9],[x-8,y+11],[x+8,y+11],[x+8,y-9],[x-8,y-9]],'#adb799',1);line([[x-5,y-9],[x-5,y-16],[x+5,y-16],[x+5,y-9]],'#adb799',1);
   glow(W*.83,H*.45,6,'rgba(172,222,191,.85)');glow(W*.842,H*.45,6,'rgba(172,222,191,.85)');
  }
  if(scene==='ward'||scene==='ward_outcome'||scene==='riddle')ward(t);
  // Silhouetted foreground roots frame the screen without obscuring the choices.

 function showRiddle(){paint(`<section class="content"><p class="eyebrow">The root-arch riddle</p><h1 class="scene-title">Words hold a way through.</h1><p class="bodycopy">The Wraith inches closer. The arch whispers:</p><blockquote class="riddle">“I can be made, kept, and broken.<br>But I can never be held.<br>What am I?”</blockquote><div class="choices">${['A promise','A lantern','A path'].map((a,i)=>`<button class="choice" data-answer="${i}"><span class="choice-num" aria-hidden="true">0${i+1}</span><span class="choice-main">${a}</span><span class="choice-tail" aria-hidden="true">›</span></button>`).join('')}</div><p class="feedback" id="riddleFeedback" role="status">Take a breath. There is no time limit.</p><button class="hint" data-action="hint">Ask the arch for a hint</button></section>`,'riddle',2,'The answer does not have to be loud.');}
 function answer(index){if(state.screen!=='riddle'||!riddleOption)return;if(index===0){const o=riddleOption;riddleOption=null;addChoice(o);chime(1);showOutcome(o,2);}else{document.querySelector('#riddleFeedback').textContent='The roots shift, but do not open. Think of something you give your word to keep.';announce('Not quite. You can try again; there is no penalty.');}}
 function run(next){const runs={fork:['Branches whip past.','Behind you: eight tiny footsteps and one very persistent meeting invitation.'],ward:['The trees close around you.','Your breath catches. A pale arch appears between the roots.'],lake:['Water. Moonlight. Almost out.','The forest falls silent. Something cold waits at the shore.']};const n=next==='fork'?0:next==='ward'?1:2;const duration=still?800:3600;
  paint(`<section class="content run-content"><p class="eyebrow">Keep moving</p><h1 class="run-title">${runs[next][0]}</h1><p class="bodycopy">${runs[next][1]}</p><div class="run-bar" style="--run-duration:${duration}ms" aria-hidden="true"><span></span></div><button class="quiet" data-skip="${next}">Continue now →</button></section>`,`run_${next}`,n,'');
  timer=setTimeout(()=>goNext(next),duration);
 }
 function goNext(next){clearTimeout(timer);if(next==='lake')showLake();else if(encounters[next])showEncounter(next);}
 function showLake(){paint(`<section class="content"><p class="eyebrow">IV · The black lake</p><h1 class="scene-title">The way out needs<br>a little of your light.</h1><p class="bodycopy">The far shore is close. But the mist is thickening, and the path has disappeared.<br><br>You raise your wand. <strong>Choose three words you would carry into the dark.</strong></p><div class="word-grid" role="group" aria-label="Choose exactly three words">${words.map(([w,t],i)=>`<button class="word" data-word="${i}" aria-pressed="false">${w}</button>`).join('')}</div><p class="word-status" id="wordStatus" role="status">0 of 3 words chosen</p><button class="primary" id="cast" data-action="cast" disabled>Call your Patronus <span class="arrow" aria-hidden="true">✧</span></button><p class="fineprint">Your journey matters too. Let these words be the final spark.</p></section>`,'lake',3,'Some light comes from within.');syncWords();}
 function toggleWord(index){if(state.screen!=='lake'||!words[index])return;const pos=state.selected.indexOf(index);if(pos!==-1)state.selected.splice(pos,1);else if(state.selected.length<3)state.selected.push(index);else{announce('Three words are already selected. Deselect one before choosing another.');return;}chime(.5);syncWords();}
 function syncWords(){stage.querySelectorAll('[data-word]').forEach(b=>{const picked=state.selected.includes(+b.dataset.word);b.setAttribute('aria-pressed',String(picked));/* Keep alternatives focusable: a fourth click explains the limit. */});const count=state.selected.length;document.querySelector('#wordStatus').textContent=`${count} of 3 words chosen${count===3?' · Your light is ready.':''}`;document.querySelector('#wordStatus').classList.toggle('complete',count===3);document.querySelector('#cast').disabled=count!==3;}

 // Deterministic scoring: the same three decisions and word set always agree.
 // Rare routes override ordinary scoring. Word click order never changes a result.
 function calculate(scores,chosen,history=[]){
  if(!scores||traits.some(t=>!Number.isFinite(scores[t])||scores[t]<0))throw new TypeError('A nonnegative score is required for every trait.');
  if(!Array.isArray(chosen)||chosen.length!==3||new Set(chosen).size!==3||chosen.some(i=>!Number.isInteger(i)||!words[i]))throw new TypeError('Choose three distinct words.');
  if(!Array.isArray(history))throw new TypeError('Journey history must be an array.');
  const combined={...scores},wordPoints=Object.fromEntries(traits.map(t=>[t,0]));
  chosen.forEach(index=>{const trait=words[index][1];combined[trait]+=2;wordPoints[trait]+=2;});
  const ranked=traits.slice().sort((a,b)=>combined[b]-combined[a]||wordPoints[b]-wordPoints[a]||traits.indexOf(a)-traits.indexOf(b));
  const picked=new Set(history.map(h=>typeof h==='string'?h:h.id));
  const rare=rareRules.find(rule=>rule.choices.every(id=>picked.has(id))&&rule.wordTraits.every(t=>wordPoints[t]>0));
  if(rare)return {trait:ranked[0],animal:animals[rare.id],kind:'rare',combined,wordPoints,ranked};
  const [first,second]=ranked;
  const mixed=combined[second]>=4&&combined[first]-combined[second]<=2
   ?mixedForms.find(form=>form.traits.includes(first)&&form.traits.includes(second)):null;
  const id=mixed?mixed.id:primaryForms[first];
  return {trait:first,animal:animals[id],kind:mixed?'mixed':'core',combined,wordPoints,ranked};
 }
 function cast(){
  if(state.screen!=='lake'||state.selected.length!==3)return;
  state.result=calculate(state.scores,state.selected,state.history).animal;
  chime(state.result.rare?3:2);
  paint(`<section class="content reveal-panel"><p class="eyebrow">${state.result.rare?'An unexpected light answers':'Remember your light'}</p><h1>Expecto Patronum.</h1><p class="bodycopy" style="margin-left:auto;margin-right:auto">${state.selected.map(i=>words[i][0]).join(' · ')}</p><button class="quiet" data-action="reveal">Follow the light →</button></section>`,'reveal',3,'');
  timer=setTimeout(showResult,still?900:4300);
 }
 function showResult(){
  if(!state.result)return;const a=state.result;
  const rareBadge=a.rare?'<p class="rare-badge"><span aria-hidden="true">✧</span> Rare Patronus · Hidden path discovered</p>':'';
  paint(`<section class="content result">${rareBadge}<p class="eyebrow">You found your way · Your Patronus is ${a.article}</p><h1 class="result-title">${a.name}.</h1><p class="result-subtitle">${a.title}</p><p class="bodycopy">${a.desc}</p><div class="word-tags" aria-label="Your chosen words">${state.selected.map(i=>`<span>${words[i][0]}</span>`).join('')}</div><div class="result-controls"><button class="primary" data-action="copy">Copy your result <span class="arrow" aria-hidden="true">↗</span></button><button class="quiet" data-action="restart">Walk the forest again</button></div><p class="flash-message" id="copyFeedback" role="status"></p><details class="result-details"><summary>What in my journey shaped this?</summary><p>${a.meaning}</p><p class="recalled">${state.history.map(h=>esc(h.memory)).join('<br>')}</p><p>Ordinary forms use 12 points from your encounters and 6 from your final words. A closely balanced pair of leading traits can reveal a mixed form. Two hidden routes combine specific actions and word families to reveal rare forms instead. Rare means a less common combination, not a better result.</p><p>Equal trait scores are resolved by points from your words, then a fixed trait order. Selecting the same words in a different order changes nothing. Riddle hints and retries never cost points. These are custom meanings for a playful fan-made story, not an official quiz or a personality assessment.</p></details></section>`,'result',4,a.rare?'A hidden path. The same way home.':'The forest is behind you now.');
 }
 async function copyResult(){if(!state.result)return;const text=`I escaped the Forbidden Fiscal Forest. My Patronus is ${state.result.article} ${state.result.name}${state.result.rare?' (rare)':''}: ${state.result.title}.\nMy three words: ${state.selected.map(i=>words[i][0]).join(', ')}.`;let success=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);success=true;}}catch(e){}if(!success){const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:0;left:-9999px';document.body.append(ta);ta.select();try{success=document.execCommand('copy');}catch(e){}ta.remove();}const fb=document.querySelector('#copyFeedback');if(!fb)return;fb.textContent=success?'Copied. A small piece of your magic to keep.':text;}
 function initAudio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;try{if(!audio){audio=new AC();bus=audio.createGain();bus.gain.value=0;bus.connect(audio.destination);[110,164.81,220].forEach((freq,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=[.035,.014,.012][i];o.connect(g);g.connect(bus);o.start();droneNodes.push(o);});}if(audio.state==='suspended')audio.resume().catch(()=>{});return true;}catch(e){return false;}}
 function toggleSound(){if(!sound&&!initAudio()){announce('Sound is not supported by this browser. The game is still fully playable.');return;}sound=!sound;if(bus)bus.gain.setTargetAtTime(sound ? .65 : 0,audio.currentTime,.35);soundButton.textContent=`Sound ${sound?'on':'off'}`;soundButton.setAttribute('aria-pressed',String(sound));soundButton.setAttribute('aria-label',`Turn atmospheric sound ${sound?'off':'on'}`);if(sound)chime(1);}
 function chime(kind){if(!sound||!audio||!bus)return;const notes=kind===3?[523.25,659.25,783.99,1046.5,1318.51]:kind===2?[523.25,659.25,783.99,1046.5]:kind===1?[523.25,783.99]:[kind===.5?587.33:392];notes.forEach((freq,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.15;o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09,t+.025);g.gain.exponentialRampToValueAtTime(.001,t+1.8);o.connect(g);g.connect(bus);o.start(t);o.stop(t+2);o.onended=()=>{o.disconnect();g.disconnect();};});}
 function syncMotion(){document.body.classList.toggle('still',still);motionButton.innerHTML=`<span class="motion-label">Motion </span>${still?'off':'on'}`;motionButton.setAttribute('aria-pressed',String(!still));motionButton.setAttribute('aria-label',`Turn animation ${still?'on':'off'}`);if(window.ForestArt)ForestArt.setMotion(still);}
 stage.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;if(button.dataset.choice!==undefined)return choose(+button.dataset.choice);if(button.dataset.answer!==undefined)return answer(+button.dataset.answer);if(button.dataset.run)return run(button.dataset.run);if(button.dataset.skip)return goNext(button.dataset.skip);if(button.dataset.word!==undefined)return toggleWord(+button.dataset.word);switch(button.dataset.action){case 'begin':chime(0);showEncounter('cave');break;case 'hint':document.querySelector('#riddleFeedback').textContent='A friend can ask you to make one. Keeping it builds trust.';break;case 'cast':cast();break;case 'reveal':showResult();break;case 'copy':copyResult();break;case 'restart':reset();break;}});
 document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;if(e.key.toLowerCase()==='m'){toggleSound();return;}if(['1','2','3'].includes(e.key)){const i=Number(e.key)-1;if(encounters[state.screen]){e.preventDefault();choose(i);}else if(state.screen==='riddle'){e.preventDefault();answer(i);}}});
 soundButton.addEventListener('click',toggleSound);motionButton.addEventListener('click',()=>{still=!still;syncMotion();});
 document.addEventListener('visibilitychange',()=>{if(audio&&bus)bus.gain.setTargetAtTime(sound && !document.hidden ? .65 : 0,audio.currentTime,.2);});
 syncMotion();reset();
 /* Inspection helpers for host validation. Ordinary play never needs this interface. */
 return {version:'2.0',getState:()=>JSON.parse(JSON.stringify(state)),calculate,encounters,words,traits,animals,primaryForms,mixedForms,rareRules};
})();
</script>
